<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#c7ccd1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Orbiting Celestial Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#emblemGrad)" stroke-width="1.5" stroke-dasharray="24 8 8 8" opacity="0.8" />
  <circle cx="50" cy="50" r="38" fill="none" stroke="#64748b" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Cosmic Dragon Constellation / Geometric Glyph -->
  <g filter="url(#glow)">
    <!-- Dragon Head & Horns -->
    <path d="M 50 14 L 56 26 L 68 20 L 58 32 L 64 42 L 50 36 L 36 42 L 42 32 L 32 20 L 44 26 Z" 
          fill="none" stroke="url(#emblemGrad)" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Dragon Eye / Core Energy Core -->
    <circle cx="50" cy="30" r="2.5" fill="#f8fafc" />

    <!-- Dragon Body & Wings / Stellar Wings -->
    <path d="M 50 36 L 50 68" stroke="url(#emblemGrad)" stroke-width="2" stroke-linecap="round" />
    <path d="M 50 48 L 74 42 L 62 58 L 50 56 L 38 58 L 26 42 L 50 48 Z" 
          fill="none" stroke="url(#emblemGrad)" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Tail / Progression Arrow -->
    <path d="M 50 68 L 44 78 L 50 86 L 56 78 Z" 
          fill="url(#emblemGrad)" stroke="url(#emblemGrad)" stroke-width="1" />

    <!-- Small Star Points -->
    <circle cx="26" cy="42" r="1.5" fill="#f8fafc" />
    <circle cx="74" cy="42" r="1.5" fill="#f8fafc" />
    <circle cx="68" cy="20" r="1.5" fill="#f8fafc" />
    <circle cx="32" cy="20" r="1.5" fill="#f8fafc" />
  </g>
</svg>
